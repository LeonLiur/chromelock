<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Blocked - ChromeLock</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      color: #d4d4d8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      /* brushed black metal: fine horizontal grain over a dark sheen */
      background:
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.015) 0px, rgba(255, 255, 255, 0.015) 1px, transparent 1px, transparent 3px),
        linear-gradient(135deg, #050505 0%, #1a1b1e 30%, #0b0b0d 55%, #232427 78%, #070708 100%);
    }

    .container {
      max-width: 600px;
      width: 100%;
      text-align: center;
      padding: 50px 40px;
      border-radius: 20px;
      background: linear-gradient(145deg, #1c1d20 0%, #0e0e10 50%, #19191c 100%);
      border: 1px solid #2e2f33;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 20px 60px rgba(0, 0, 0, 0.7);
      animation: slideIn 0.4s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 20px;
      color: #a1a1aa;
    }

    h1 {
      font-size: 32px;
      color: #f4f4f5;
      margin-bottom: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    p {
      font-size: 17px;
      color: #8b8b93;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .quote {
      padding: 20px 24px;
      margin-bottom: 30px;
      border-left: 3px solid #71717a;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.03);
      text-align: left;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: opacity 0.5s ease;
    }

    .quote.fade {
      opacity: 0;
    }

    .quote-text {
      font-size: 17px;
      font-style: italic;
      line-height: 1.5;
      color: #e4e4e7;
    }

    .quote-author {
      margin-top: 10px;
      font-size: 13px;
      color: #71717a;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .unblock-section {
      background: rgba(255, 255, 255, 0.025);
      padding: 30px;
      border-radius: 12px;
      margin-bottom: 10px;
      text-align: left;
      border: 1px solid #2e2f33;
    }

    .unblock-section h2 {
      font-size: 20px;
      color: #f4f4f5;
      margin-bottom: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #a1a1aa;
      margin-bottom: 8px;
    }

    .form-group input,
    .form-group textarea,
    .time-input-group .unit {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #3a3b40;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      color: #f4f4f5;
      background: #0b0b0d;
      transition: all 0.2s;
      outline: none;
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: #52525b;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #a1a1aa;
      box-shadow: 0 0 0 3px rgba(161, 161, 170, 0.15);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .time-input-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .time-input-group input {
      flex: 1;
    }

    /* minutes is the only unit, so it is a static label rather than a select */
    .time-input-group .unit {
      width: auto;
      color: #a1a1aa;
    }

    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: linear-gradient(180deg, #e4e4e7 0%, #a1a1aa 100%);
      color: #0b0b0d;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s;
      border: none;
      cursor: pointer;
      width: 100%;
      margin-bottom: 10px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: #27272a;
      color: #d4d4d8;
      border: 1px solid #3a3b40;
    }

    .btn-secondary:hover {
      background: #323236;
    }

    .tip {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid #2e2f33;
      font-size: 13px;
      color: #5f5f67;
    }

    .error {
      color: #f87171;
      font-size: 14px;
      margin-top: 8px;
      display: none;
    }

    .error.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="4" y="10" width="16" height="11" rx="2"></rect>
      <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
      <circle cx="12" cy="15.5" r="1.2" fill="currentColor"></circle>
    </svg>
    <h1>Site Blocked</h1>
    <p id="blockedSiteText">This website has been blocked by ChromeLock to help you stay focused and productive.</p>

    <div class="quote" id="quote">
      <div class="quote-text" id="quoteText"></div>
      <div class="quote-author" id="quoteAuthor"></div>
    </div>

    <div class="unblock-section">
      <h2>Need Temporary Access?</h2>
      <form id="unblockForm">
        <div class="form-group">
          <label for="reason">Why do you need access? *</label>
          <textarea 
            id="reason" 
            placeholder="e.g., Research for work project, checking important notification..."
            required
          ></textarea>
          <div class="error" id="reasonError">Please provide a reason</div>
        </div>

        <div class="form-group">
          <label for="duration">How long do you need? *</label>
          <div class="time-input-group">
            <input 
              type="number" 
              id="duration" 
              min="1" 
              max="120" 
              placeholder="15"
              required
            >
            <span class="unit">Minutes</span>
          </div>
          <div class="error" id="durationError">Please enter a valid duration</div>
        </div>

        <button type="submit" class="btn">Unblock Temporarily</button>
        <button type="button" class="btn btn-secondary" id="goBackBtn">Go Back</button>
      </form>
    </div>

    <div class="tip">
      Tip: you can manage your blocked sites by clicking the ChromeLock icon in your browser toolbar.
    </div>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
